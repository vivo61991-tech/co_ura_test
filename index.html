<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>URA · Evolução</title>
<meta name="theme-color" content="#642A90">
<meta name="description" content="Evolução das chamadas da URA a cada 30 minutos: hoje contra a média geral e a média do dia da semana.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
:root{
  /* paleta da empresa — mesma do Problemas Sistêmicos / Nível de Serviço */
  --roxo:#642A90; --verdeB:#99CC33; --laranja:#FF9901; --rosa:#EC357D; --azulB:#0164C9;
  --p50:#f6f1fa; --p100:#ebe0f4; --p200:#d5bfe7; --p300:#b48fd3; --p500:#8549b5; --p700:#642A90; --p800:#52227a; --p900:#3a1658;
  --brand:var(--p700); --accent:var(--p700);
  --bg:#EFEAF5; --card:#fff; --nav:#F3EFF8; --ink:#1f1530; --ink2:#5b5068; --ink3:#9a90a8; --line:#e6e0ee;
  --ok:#5f8a12; --okbg:#eef7dc; --warn:#b36800; --warnbg:#fff1dc; --bad:#c41a60; --badbg:#fde6ef;
  /* linhas do gráfico */
  --hoje:#642A90; --hojeArea:#ebe0f4; --media:#9a90a8;
  --r:20px; --sh:0 1px 3px rgba(58,22,88,.05),0 10px 28px rgba(58,22,88,.09);
  --fundo:radial-gradient(70% 45% at 100% 0%,#E4D6F3 0%,transparent 70%),radial-gradient(60% 40% at 0% 55%,#F5E6F0 0%,transparent 70%),radial-gradient(70% 45% at 90% 100%,#E9E0F6 0%,transparent 70%),linear-gradient(180deg,#F2EEF7,#ECE6F3);
  --safe-t: env(safe-area-inset-top, 0px); --safe-b: env(safe-area-inset-bottom, 0px);
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#120A1A; --card:#221832; --nav:#160D20; --ink:#efe9f6; --ink2:#bdb1cc; --ink3:#7d7190; --line:#352849;
    --brand:var(--p800); --accent:#b48fd3;
    --ok:#b6e05a; --okbg:#253312; --warn:#ffb347; --warnbg:#3a2608; --bad:#ff6fa5; --badbg:#3f1226;
    --hoje:#c49be6; --hojeArea:#2e1f44; --media:#7d7190;
    --sh:0 1px 0 rgba(255,255,255,.04) inset,0 10px 28px rgba(0,0,0,.38);
    --fundo:radial-gradient(70% 45% at 100% 0%,#2A1840 0%,transparent 70%),radial-gradient(60% 40% at 0% 55%,#2A1426 0%,transparent 70%),linear-gradient(180deg,#140C1E,#100818); }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);overflow-x:clip}
body{background:transparent;font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:var(--fundo);pointer-events:none}
button{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}

/* topo */
header.top{position:sticky;top:0;z-index:30;box-shadow:0 2px 10px rgba(31,12,48,.18);background:linear-gradient(135deg,var(--p800),var(--p700) 60%,var(--p500));color:#fff;padding:calc(10px + var(--safe-t)) 16px 10px}
.top .row{display:flex;align-items:center;gap:10px;max-width:760px;margin:0 auto}
.top .tt{flex:1;min-width:0}
.top h1{font-size:18px;margin:0;font-weight:700;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sync{display:flex;align-items:center;gap:6px;font-size:12.5px;opacity:.92;margin-top:2px}
.dot{width:8px;height:8px;border-radius:50%;background:#fff;flex:none;opacity:.9}
.dot.off{background:var(--laranja)}
.dot.err{background:var(--rosa);box-shadow:0 0 0 2px #fff}
.ib{width:40px;height:40px;border-radius:14px;border:1px solid rgba(255,255,255,.24);background:rgba(255,255,255,.14);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);color:#fff;display:grid;place-items:center;cursor:pointer;flex:none;text-decoration:none}
.ib:active{background:rgba(255,255,255,.26)}
.ib svg{width:20px;height:20px}

main{max-width:760px;margin:0 auto;padding:12px 12px calc(28px + var(--safe-b))}

/* navegação de dias */
.dias{display:flex;align-items:center;gap:8px;margin:4px 2px 14px}
.dias .nav{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);display:grid;place-items:center;cursor:pointer;flex:none;box-shadow:var(--sh)}
.dias .nav:disabled{opacity:.4;cursor:default}
.dias .nav svg{width:18px;height:18px}
.dias .lbl{flex:1;text-align:center;min-width:0}
.dias .lbl b{display:block;font-size:15px;font-weight:700}
.dias .lbl small{display:block;font-size:12px;color:var(--ink3)}

/* card do gráfico */
.cg{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:16px 14px 12px;margin-bottom:16px}
.cg .cab{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:0 2px 2px}
.cg .cab h2{font-size:15px;margin:0;font-weight:700}
.cg .cab .tot{font-size:13px;color:var(--ink3);white-space:nowrap}
.cg .cab .tot b{color:var(--ink);font-size:15px}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:12.5px;font-weight:700;margin:2px 2px 8px;line-height:1.5}
.chip.alta{background:var(--badbg);color:var(--bad)}
.chip.baixa{background:var(--okbg);color:var(--ok)}
.chip.estavel{background:var(--p100);color:var(--p700)}
@media (prefers-color-scheme: dark){.chip.estavel{background:#3a2356;color:#d5bfe7}}
.chip svg{width:13px;height:13px}
.cg svg.graf{display:block;width:100%;height:auto;touch-action:pan-y}
.cg svg.graf text{fill:var(--ink3);font-size:9px;font-variant-numeric:tabular-nums}
.leg{display:flex;flex-wrap:wrap;gap:14px;margin:6px 4px 2px;font-size:12.5px;color:var(--ink2)}
.leg span{display:inline-flex;align-items:center;gap:6px}
.leg i{width:16px;height:0;border-top:3px solid var(--hoje);border-radius:2px}
.leg i.tr{border-top:2px dashed var(--media)}
.toque{display:block;margin:8px 4px 0;font-size:12.5px;color:var(--ink3);min-height:1.4em}
.toque b{color:var(--ink);font-weight:700}

.aviso{border-radius:12px;padding:10px 12px;font-size:13.5px;margin:0 2px 14px}
.aviso.warn{background:var(--warnbg);color:var(--warn)}
.aviso.bad{background:var(--badbg);color:var(--bad)}
.vazio{color:var(--ink3);text-align:center;padding:26px 10px}
</style>
</head>
<body>
<header class="top">
  <div class="row">
    <a class="ib" id="btHub" href="https://vivo61991-tech.github.io/" aria-label="Voltar ao HUB" title="Voltar ao HUB">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
    </a>
    <div class="tt">
      <h1>URA · Evolução</h1>
      <div class="sync"><span class="dot" id="syncDot"></span><span id="syncTx">Carregando…</span></div>
    </div>
    <button class="ib" id="btRefresh" aria-label="Atualizar agora" title="Atualizar agora">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v5h-5"/></svg>
    </button>
  </div>
</header>

<main id="app">
  <div class="vazio" id="inicial">Carregando…</div>
</main>

<script src="grafico.js?v=1.0.0"></script>
<script src="app.js?v=1.0.0"></script>
</body>
</html>
